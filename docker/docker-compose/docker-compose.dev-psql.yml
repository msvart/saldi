services:
  app:
    build:
      context: ../..
      dockerfile: ../Dockerfile
    container_name: saldi_app_dev
    ports:
      - "8080:80"
    environment:
      SALDI_DOCKER: ${SALDI_DOCKER:?set SALDI_DOCKER}
      DB_TYPE: ${DB_TYPE:?set DB_TYPE}
      DB_HOST: ${DB_HOST:?set DB_HOST}
      DB_NAME: ${DB_NAME:?set DB_NAME}
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      # Dev: Mount source code for live editing
      - ./src:/var/www/html

      # Persistent data mounts
      - ./saldibilag:/var/www/html/saldibilag
      - ./backup:/backup

      # Temporary directories as volumes to handle permissions when mounting source
      - saldi_temp:/var/www/html/temp
      - saldi_includes_temp:/var/www/html/includes/temp
      - saldi_bordplaner_temp:/var/www/html/bordplaner/temp
      - saldi_logolib:/var/www/html/logolib
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15
    container_name: saldi_db
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME}
      POSTGRES_USER: ${DB_USER:?set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - saldi_data:/var/lib/postgresql/data
    restart: always

volumes:
  saldi_data:
  saldi_temp:
  saldi_includes_temp:
  saldi_bordplaner_temp:
  saldi_logolib: